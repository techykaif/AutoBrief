name: AutoBrief Content Pipeline Quality Tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/rss/**"
      - "scripts/apps-script/**"
      - "scripts/export/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rss-content-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/rss/**"
      - "scripts/apps-script/**"
      - "scripts/export/**"
      - "apps-script/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rss-content-tests.yml"

jobs:
  test-content-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check RSS scraper and helpers
        run: >-
          npx tsc --noEmit --target ES2020 --module ESNext
          --moduleResolution bundler --strict --skipLibCheck --esModuleInterop
          --types node scripts/rss/rssScraper.ts scripts/rss/contentUtils.ts
          scripts/googleSheets.ts

      - name: Run all content pipeline regression tests
        run: npm test

      - name: Type-check export safety helpers and tests
        run: >-
          npx tsc --noEmit --target ES2020 --module ESNext
          --moduleResolution bundler --strict --skipLibCheck --esModuleInterop
          --types node scripts/export/contentSafety.ts
          scripts/export/contentSafety.test.ts
