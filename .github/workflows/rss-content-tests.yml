name: RSS Content Utility Tests

on:
  pull_request:
    paths:
      - "scripts/rss/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rss-content-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/rss/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rss-content-tests.yml"

jobs:
  test-rss-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check RSS scraper and helpers
        run: >-
          npx tsc --noEmit --target ES2020 --module ESNext
          --moduleResolution bundler --strict --skipLibCheck --esModuleInterop
          --types node scripts/rss/rssScraper.ts scripts/rss/contentUtils.ts
          scripts/googleSheets.ts

      - name: Run RSS content utility tests
        run: npm run test:rss
