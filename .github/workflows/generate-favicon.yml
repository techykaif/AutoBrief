name: Generate Search Favicon

on:
  push:
    branches:
      - fix/google-search-favicon
  workflow_dispatch:

permissions:
  contents: write

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate square favicon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/logo.png")
          output = Path("public/favicon.png")
          image = Image.open(source).convert("RGBA")
          size = max(image.size)
          canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          offset = ((size - image.width) // 2, (size - image.height) // 2)
          canvas.alpha_composite(image, offset)
          canvas.save(output, format="PNG", optimize=True)
          print(f"Generated {output} at {canvas.size[0]}x{canvas.size[1]}")
          PY

      - name: Commit generated favicon
        run: |
          if ! git status --short -- public/favicon.png | grep -q .; then
            echo "Favicon is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.png
          git commit -m "chore(seo): add square favicon"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
